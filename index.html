<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق أكلة حلوة - ألذ الوصفات في جيبك</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0f18;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية متحركة وأنوار ودلع */
        .background-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 8s infinite alternate ease-in-out;
        }
        .circle-1 {
            width: 300px;
            height: 300px;
            background: #ff7b00;
            top: -50px;
            right: -50px;
        }
        .circle-2 {
            width: 350px;
            height: 350px;
            background: #e91e63;
            bottom: -50px;
            left: -50px;
            animation-delay: 4s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* كارد المحتوى بتصميم الجلاس مورفيزم */
        .container {
            position: relative;
            z-index: 2;
            max-width: 420px;
            width: 90%;
            padding: 40px 30px;
            background: rgba(20, 22, 37, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ff9800, #ff4081);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        p {
            color: #b8b9c5;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* زرار التحميل المتحرك */
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff9800, #f50057);
            color: white;
            padding: 16px 32px;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 40px;
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(245, 0, 87, 0.6);
            background: linear-gradient(135deg, #ffa726, #f50057);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #6c7086;
        }
    </style>
</head>
<body>

    <div class="background-glow">
        <div class="glow-circle circle-1"></div>
        <div class="glow-circle circle-2"></div>
    </div>

    <div class="container">
        <div class="app-icon">🍲</div>
        <h1>أكلة حلوة</h1>
        <p>اكتشف أشهى الوصفات وأسرع الأكلات البيتية. حمل التطبيق الآن واستمتع بتجربة طهي ولا أروع!</p>
        
        <!-- رابط التحميل المباشر للـ APK -->
        <a href="https://raw.githubusercontent.com/karemtoreco-lab/aklah-helwa-landing/main/app-release.apk" class="btn">تحميل التطبيق (APK) 🚀</a>
        
        <div class="footer-note">متوافق مع أجهزة أندرويد • آمن ومجاني</div>
    </div>

</body>
</html>
