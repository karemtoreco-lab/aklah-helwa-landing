<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق أكلة حلوة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 30px;
            background: rgba(25, 25, 25, 0.8);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #ff9800;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>أكلة حلوة 🍲</h1>
        <p>استمتع بألذ الوصفات والأكلات السريعة. حمل التطبيق الآن واستمتع بتجربة مميزة على هاتفك المحمول.</p>
        
        <!-- رابط التحميل المباشر للـ APK -->
        <a href="https://raw.githubusercontent.com/karemtoreco-lab/aklah-helwa-landing/main/app-release.apk" class="btn">تحميل التطبيق الآن (APK)</a>
    </div>

</body>
</html>
