<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق أكلة حلوة - ألذ الوصفات في جيبك</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* خلفية صورة طولية مع طبقة مظلمة شفافة لزيادة وضوح الكلام */
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* كارد المحتوى بتصميم الجلاس مورفيزم الفخم */
        .container {
            position: relative;
            z-index: 2;
            max-width: 420px;
            width: 100%;
            padding: 40px 30px;
            background: rgba(20, 22, 37, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ff9800, #ff4081);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        p {
            color: #d0d2d6;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* زرار التحميل المتحرك */
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff9800, #f50057);
            color: white;
            padding: 16px 32px;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 40px;
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(245, 0, 87, 0.6);
        }

        .footer-note {
            Motto-top: 20px;
            margin-top: 20px;
            font-size: 12px;
            color: #9499b7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-icon">🍲</div>
        <h1>أكلة حلوة</h1>
        <p>اكتشف أشهى الوصفات وأسرع الأكلات البيتية. حمل التطبيق الآن واستمتع بتجربة طهي ولا أروع!</p>
        
        <!-- رابط التحميل المباشر للـ APK -->
        <a href="https://raw.githubusercontent.com/karemtoreco-lab/aklah-helwa-landing/main/app-release.apk" class="btn">تحميل التطبيق (APK) 🚀</a>
        
        <div class="footer-note">متوافق مع أجهزة أندرويد • آمن ومجاني</div>
    </div>

</body>
</html>
